[package]
name = "leanvm-xmss-c"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
test-config = ["lean-multisig/test-config", "leansig_wrapper/test-config"]

[dependencies]
lean-multisig = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "f66d4a974eced803574eb0ea43d812e523c8d7ad", package = "lean-multisig" }
leansig = { git = "https://github.com/leanEthereum/leanSig" }
leansig_wrapper = { git = "https://github.com/leanEthereum/leanMultisig.git", rev = "f66d4a974eced803574eb0ea43d812e523c8d7ad", package = "leansig_wrapper" }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssz = { package = "ethereum_ssz", version = "0.10" }

[build-dependencies]
cbindgen = "0.27"
