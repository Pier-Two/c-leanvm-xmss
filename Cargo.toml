[package]
name = "leanvm-xmss-c"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
test-config = ["rec_aggregation/test-config", "leansig_wrapper/test-config"]

[dependencies]
backend = { git = "https://github.com/leanEthereum/leanVM", rev = "3f2116d74bb3a75f447287056715ad1ef627a84e" }
leansig = { git = "https://github.com/leanEthereum/leanSig", branch = "devnet4" }
leansig_wrapper = { git = "https://github.com/leanEthereum/leanVM", rev = "3f2116d74bb3a75f447287056715ad1ef627a84e" }
rec_aggregation = { git = "https://github.com/leanEthereum/leanVM", rev = "3f2116d74bb3a75f447287056715ad1ef627a84e" }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssz = { package = "ethereum_ssz", version = "0.10" }
tikv-jemallocator = "0.6"

[build-dependencies]
cbindgen = "0.27"
